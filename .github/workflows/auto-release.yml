name: Auto Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      - name: Ensure Paper API jar is available
        run: |
          set -euo pipefail
          mkdir -p relicbound-paper/libs
          # read paperApiVersion from gradle.properties
          PAPER_VER=$(grep -E '^paperApiVersion\s*=' gradle.properties | sed -E "s/.*=\s*//" | tr -d '\r' || true)
          if [ -z "$PAPER_VER" ]; then
            echo "paperApiVersion not set in gradle.properties; please vendor a paper-api.jar into relicbound-paper/libs/"
            exit 1
          fi
          echo "Attempting to download paper-api ${PAPER_VER} into relicbound-paper/libs/paper-api.jar"
          URLS=( \
            "https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/${PAPER_VER}/paper-api-${PAPER_VER}.jar" \
            "https://repo.maven.apache.org/maven2/io/papermc/paper/paper-api/${PAPER_VER}/paper-api-${PAPER_VER}.jar" \
          )
          SUCCESS=0
          for u in "${URLS[@]}"; do
            echo "Trying $u"
            if curl -fsSL "$u" -o relicbound-paper/libs/paper-api.jar; then
              echo "Downloaded paper-api jar from $u"
              SUCCESS=1
              break
            else
              echo "Failed to download from $u"
            fi
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Could not download paper-api jar for version ${PAPER_VER}."
            echo "Please place the correct paper-api jar at relicbound-paper/libs/paper-api.jar and re-run the workflow."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build (no wrapper required)
        uses: gradle/gradle-build-action@v2
        continue-on-error: true
        with:
          arguments: ':relicbound-paper:clean :relicbound-paper:build -x test'
          gradle-version: '8.8'

      - name: Locate built JAR
        id: find_jar
        run: |
          set -euo pipefail
          # Search common locations for an existing plugin jar. This lets us upload a vendored jar
          # even if the Gradle build failed (for example due to missing paper-api on the runner).
          CANDIDATES=( \
            "relicbound-paper/build/libs/*.jar" \
            "relicbound-paper/release/*.jar" \
            "release/*.jar" \
            "relicbound-paper/libs/*.jar" \
          )
          FOUND=""
          for p in "${CANDIDATES[@]}"; do
            for f in $p; do
              if [ -f "$f" ]; then
                FOUND="$f"
                break 2
              fi
            done
          done
          if [ -z "$FOUND" ]; then
            echo "No JAR found in build or release paths. Searched: ${CANDIDATES[*]}"
            exit 1
          fi
          echo "Found JAR: $FOUND"
          echo "jar=$FOUND" >> $GITHUB_OUTPUT

      - name: Get project version
        id: get_version
        run: |
          set -e
          # Try to read version from root build.gradle (format: version = 'x.y.z')
          VERSION=$(grep -E "^\s*version\s*=\s*'[^']+'" build.gradle | sed -E "s/.*'([^']+)'.*/\1/" || true)
          if [ -z "$VERSION" ]; then
            # fallback to run number + sha
            VERSION="${{ github.run_number }}-${{ github.sha }}"
          fi
          # ensure tag starts with v
          if [[ "$VERSION" == v* ]]; then
            TAG="$VERSION"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and upload artifact
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.version }}
          files: ${{ steps.find_jar.outputs.jar }}
          body: Automated build release from main
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
