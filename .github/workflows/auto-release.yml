name: Auto Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build (no wrapper required)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ':relicbound-paper:clean :relicbound-paper:build -x test'
          gradle-version: '8.8'

      - name: Verify built JAR exists
        run: |
          set -euo pipefail
          ls -l relicbound-paper/build/libs/*.jar

      - name: Get project version
        id: get_version
        run: |
          set -e
          # Try to read version from root build.gradle (format: version = 'x.y.z')
          VERSION=$(grep -E "^\s*version\s*=\s*'[^']+'" build.gradle | sed -E "s/.*'([^']+)'.*/\1/" || true)
          if [ -z "$VERSION" ]; then
            # fallback to run number + sha
            VERSION="${{ github.run_number }}-${{ github.sha }}"
          fi
          # ensure tag starts with v
          if [[ "$VERSION" == v* ]]; then
            TAG="$VERSION"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Relicbound SMP ${{ steps.get_version.outputs.version }}
          files: |
            relicbound-paper/build/libs/*.jar
          body: Automated build release from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
