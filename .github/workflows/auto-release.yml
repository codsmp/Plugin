name: Auto Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build (no wrapper required)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ':relicbound-paper:clean :relicbound-paper:build -x test'
          gradle-version: '8.8'

      - name: Locate built JAR
        id: find_jar
        run: |
          set -euo pipefail
          # Search common locations for an existing plugin jar. This lets us upload a vendored jar
          # even if the Gradle build failed (for example due to missing paper-api on the runner).
          CANDIDATES=( \
            "relicbound-paper/build/libs/*.jar" \
            "relicbound-paper/release/*.jar" \
            "release/*.jar" \
          )
          FOUND=""
          for p in "${CANDIDATES[@]}"; do
            for f in $p; do
              if [ -f "$f" ]; then
                FOUND="$f"
                break 2
              fi
            done
          done
          if [ -z "$FOUND" ]; then
            echo "No JAR found in build or release paths. Searched: ${CANDIDATES[*]}"
            exit 1
          fi
          echo "Found JAR: $FOUND"
          echo "jar=$FOUND" >> $GITHUB_OUTPUT

      - name: Get project version
        id: get_version
        run: |
          set -e
          # Try to read version from root build.gradle (format: version = 'x.y.z')
          VERSION=$(grep -E "^\s*version\s*=\s*'[^']+'" build.gradle | sed -E "s/.*'([^']+)'.*/\1/" || true)
          if [ -z "$VERSION" ]; then
            # fallback to run number + sha
            VERSION="${{ github.run_number }}-${{ github.sha }}"
          fi
          # ensure tag starts with v
          if [[ "$VERSION" == v* ]]; then
            TAG="$VERSION"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and upload artifact
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.version }}
          files: ${{ steps.find_jar.outputs.jar }}
          body: Automated build release from main
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
