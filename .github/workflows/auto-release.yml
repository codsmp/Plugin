name: Auto Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build (no wrapper required)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ':relicbound-paper:clean :relicbound-paper:build -x test'
          gradle-version: '8.8'

      - name: Locate built JAR
        id: find_jar
        run: |
          set -e
          JAR=$(ls relicbound-paper/build/libs/*.jar | head -n1 || true)
          if [ -z "$JAR" ]; then echo "No JAR found"; exit 1; fi
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      - name: Get project version
        id: get_version
        run: |
          set -e
          # Try to read version from root build.gradle (format: version = 'x.y.z')
          VERSION=$(grep -E "^\s*version\s*=\s*'[^']+'" build.gradle | sed -E "s/.*'([^']+)'.*/\1/" || true)
          if [ -z "$VERSION" ]; then
            # fallback to run number + sha
            VERSION="${{ github.run_number }}-${{ github.sha }}"
          fi
          # ensure tag starts with v
          if [[ "$VERSION" == v* ]]; then
            TAG="$VERSION"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and upload artifact
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}-${{ github.sha }}
          name: Release ${{ github.run_number }}
          files: ${{ steps.find_jar.outputs.jar }}
          body: Automated build release from main
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
