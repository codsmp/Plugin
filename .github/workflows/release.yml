name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Package resource pack
        run: |
          cd resource-pack
          zip -r ../relicbound-resource-pack.zip .

      - name: Upload Paper jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: relicbound-paper-${{ github.ref_name }}
          path: relicbound-paper/build/libs/*.jar
          if-no-files-found: error

      - name: Upload resource pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: relicbound-resource-pack-${{ github.ref_name }}
          path: relicbound-resource-pack.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Relicbound SMP ${{ github.ref_name }}
          files: |
            relicbound-paper/build/libs/*.jar
            relicbound-resource-pack.zip
          generate_release_notes: true
          fail_on_unmatched_files: false