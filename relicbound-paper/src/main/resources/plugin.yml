name: Witch
main: com.relicbound.paper.RelicboundPaperPlugin
version: 0.1.0
api-version: '1.21'
author: Witch SMP
load: POSTWORLD
commands:
  info:
    description: View your Witch status, progression, and controls.
    usage: /info
    permission: witch.command.info
  spell:
    description: Open your spell loadout menu.
    usage: /spell
    permission: witch.command.info
  witch:
    description: View your Witch status, progression, and controls.
    usage: /witch
    permission: witch.command.info
  witchspells:
    description: Open your spell loadout menu.
    usage: /witchspells
    permission: witch.command.info
  witchupgrade:
    description: Upgrade your Witch tier.
    usage: /witchupgrade
    permission: witch.command.info
  witchgrant:
    description: Grant essence to a player (admin).
    usage: /witchgrant <player> <essenceType> <amount>
    permission: witch.admin.grant
  witchreset:
    description: Reset all Witch player data.
    usage: /witchreset
    permission: witch.admin.reset
  relicreset:
    description: Reset all Witch player data.
    usage: /relicreset
    permission: witch.admin.reset
  trust:
    description: Trust a player so they cannot damage you.
    usage: /trust <player>
    permission: witch.command.trust
  graceperiod:
    description: Start or manage global no-damage grace period.
    usage: /graceperiod [status|stop]
    permission: witch.admin.grace
  ac:
    description: Witch anticheat admin commands.
    usage: /ac <debug|violations|reload>
    permission: witch.admin.debug
permissions:
  witch.command.info:
    default: true
  witch.command.trust:
    default: true
  witch.admin.grant:
    default: op
  witch.admin.reset:
    default: op
  witch.admin.debug:
    default: op
  witch.admin.grace:
    default: op
