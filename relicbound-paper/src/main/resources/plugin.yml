name: RelicboundSMP
main: com.relicbound.paper.RelicboundPaperPlugin
version: 0.1.0-SNAPSHOT
api-version: '1.21'
author: Relicbound SMP
load: POSTWORLD
commands:
  relicbound:
    description: View your relic state.
    usage: /relicbound
    permission: relicbound.command.info
  relicboundspells:
    description: Open the relic spells menu.
    usage: /relicboundspells
    permission: relicbound.command.info
  relicboundupgrade:
    description: Upgrade your relic tier.
    usage: /relicboundupgrade
    permission: relicbound.command.info
  relicboundgrant:
    description: Grant essence to a player (admin).
    usage: /relicboundgrant <player> <essenceType> <amount>
    permission: relicbound.admin.grant
  rb:
    description: Alias for /relicbound
    usage: /rb
    permission: relicbound.command.info
  trust:
    description: Trust a player so they cannot damage you.
    usage: /trust <player>
permissions:
  relicbound.command.info:
    default: true
  relicbound.admin.grant:
    default: op
