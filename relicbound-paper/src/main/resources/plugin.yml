name: Witch
main: com.relicbound.paper.RelicboundPaperPlugin
version: 0.1.0
api-version: '1.21'
author: Witch SMP
load: POSTWORLD
commands:
  info:
    description: View your Witch status, progression, and controls.
    usage: /info
    permission: relicbound.command.info
  spell:
    description: Open your spell loadout menu.
    usage: /spell
    permission: relicbound.command.info
  relicbound:
    description: Legacy alias for /info.
    usage: /relicbound
    permission: relicbound.command.info
  relicboundspells:
    description: Legacy alias for /spell.
    usage: /relicboundspells
    permission: relicbound.command.info
  relicboundupgrade:
    description: Upgrade your Witch tier.
    usage: /relicboundupgrade
    permission: relicbound.command.info
  relicboundgrant:
    description: Grant essence to a player (admin).
    usage: /relicboundgrant <player> <essenceType> <amount>
    permission: relicbound.admin.grant
  relicreset:
    description: Reset all Relicbound player data.
    usage: /relicreset
    permission: relicbound.admin.reset
  rb:
    description: Legacy alias for /info
    usage: /rb
    permission: relicbound.command.info
  trust:
    description: Trust a player so they cannot damage you.
    usage: /trust <player>
    permission: relicbound.command.trust
  graceperiod:
    description: Start or manage global no-damage grace period.
    usage: /graceperiod [status|stop]
    permission: relicbound.admin.grace
permissions:
  relicbound.command.info:
    default: true
  relicbound.command.trust:
    default: true
  relicbound.admin.grant:
    default: op
  relicbound.admin.reset:
    default: op
  relicbound.admin.debug:
    default: op
  relicbound.admin.grace:
    default: op
