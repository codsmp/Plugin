dependencies {
    implementation project(':relicbound-core')
    def paperApiVersion = project.hasProperty('paperApiVersion') ? project.property('paperApiVersion') : '1.21.4-R0.1-SNAPSHOT'
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
}

// Include relicbound-core classes in the plugin jar so the plugin doesn't depend on an external core jar.
tasks.named('jar') {
    from(project(':relicbound-core').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
